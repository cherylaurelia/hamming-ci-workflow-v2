name: Test PR

on:
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/hamming_run_test.yml
    with:
      agent_id: ${{ contains(github.head_ref, 'runfailed') && 'runfailed' || contains(github.head_ref, 'fail') && 'fail' || (contains(github.head_ref, 'timeout') && 'timeout' || 'pass') }}
      phone_numbers: "+15551234567"
      tag_ids: "stub-tag"
      timeout_seconds: ${{ contains(github.head_ref, 'timeout') && '20' || '900' }}
      min_test_pass_rate: "0.8"
      min_assertion_pass_rate: "0.9"
    secrets:
      HAMMING_API_KEY: ${{ secrets.HAMMING_API_KEY }}
